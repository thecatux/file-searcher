[package]
name = "file-searcher"
version = "0.2.1"
edition = "2024"

[dependencies]
eframe = { version = "0.31", features = ["glow", "default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
ignore = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
winres = "0.1"
winresource = "0.1.31"
